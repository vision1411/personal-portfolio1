document.getElementById('app').innerHTML=hero+story+`<section id="verticals" class="mx-auto max-w-6xl px-5 py-20 md:py-28"><div class="mb-8"><p class="font-mono text-xs uppercase tracking-widest text-cyan-400">// explore</p><h2 class="mt-3 text-4xl font-semibold tracking-tight md:text-5xl">Feel free to browse about me</h2></div><div class="grid grid-cols-1 gap-4 md:auto-rows-[18rem] md:grid-cols-3">${['education','skills','sports','work','contact'].map(bc).join('')}</div><p class="mt-16 text-center font-mono text-xs text-gray-500">© ${new Date().getFullYear()} ${D.name}</p></section><div id="vm" class="vm" aria-hidden="true"><div class="vmb"></div><div class="vmp" role="dialog" aria-modal="true" aria-label="Details"><button type="button" class="vmx" aria-label="Close">×</button>${edu+work+skills+sports+contact}</div></div>`;
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.1,rootMargin:'0px 0px -40px 0px'});
const watch=()=>document.querySelectorAll('.rv:not(.in)').forEach(n=>io.observe(n));
const grid=document.getElementById('grid'),pill=document.getElementById('pill');
function movePill(b){pill.style.left=b.offsetLeft+'px';pill.style.top=b.offsetTop+'px';pill.style.width=b.offsetWidth+'px';pill.style.height=b.offsetHeight+'px'}
function render(k){grid.innerHTML=D.projects.filter(p=>k==='all'||p.t===k).map(proj).join('');watch()}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{window.__tb=b;movePill(b);grid.classList.add('fade');setTimeout(()=>{render(b.dataset.k);grid.classList.remove('fade')},200)});
render('all');watch();
const first=document.querySelector('#tabs button');
const place=()=>movePill(window.__tb||first);place();addEventListener('load',place);addEventListener('resize',place);document.fonts&&document.fonts.ready.then(place);
document.getElementById('cp').onclick=async()=>{try{await navigator.clipboard.writeText(D.email)}catch(_){}const t=document.getElementById('toast');t.style.opacity=1;t.style.transform='translate(-50%,0)';setTimeout(()=>{t.style.opacity=0;t.style.transform='translate(-50%,20px)'},2000)};
const vm=document.getElementById('vm'),vmp=vm.querySelector('.vmp'),vds=[...vm.querySelectorAll('.vd')],bcs=[...document.querySelectorAll('.bc')];let lastF=null;
function openV(id){const d=document.getElementById('d-'+id);if(!d)return;vds.forEach(x=>x.classList.toggle('on',x===d));lastF=document.activeElement;vm.classList.add('on');vm.setAttribute('aria-hidden','false');document.documentElement.style.overflow='hidden';vmp.scrollTop=0;place();vm.querySelector('.vmx').focus({preventScroll:true})}
function closeV(){vm.classList.remove('on');vm.setAttribute('aria-hidden','true');document.documentElement.style.overflow='';lastF&&lastF.focus&&lastF.focus({preventScroll:true})}
bcs.forEach(c=>c.onclick=()=>openV(c.id));
vm.querySelector('.vmb').onclick=closeV;vm.querySelector('.vmx').onclick=closeV;
addEventListener('keydown',e=>{if(e.key==='Escape'&&vm.classList.contains('on'))closeV()});
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;const id=a.getAttribute('href').slice(1);if(!bcs.some(c=>c.id===id))return;e.preventDefault();openV(id)});
if(bcs.some(c=>'#'+c.id===location.hash))openV(location.hash.slice(1));
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
const SC="I’m an undergrad at IIT Roorkee who builds software and cuts motion-driven edits. I like work where engineering rigor meets a creative eye.";
const sc=document.getElementById('sc');const HL=new Set(['software','motion-driven','edits.','engineering','rigor','creative','eye.']);sc.innerHTML=SC.split(' ').map(w=>`<span class="w${HL.has(w)?' hl':''}">${w}</span>`).join(' ');
const chips=[...document.querySelectorAll('.sch')],sl1=document.getElementById('sl1'),sl2=document.getElementById('sl2');
const ws=[...sc.children],pin=document.getElementById('story'),ph=document.getElementById('ph'),hc=document.getElementById('hc'),bar=document.getElementById('bar');
function tick(){const vh=innerHeight,y=scrollY;
bar.style.transform=`scaleX(${y/Math.max(1,document.documentElement.scrollHeight-vh)})`;
const h=rm?0:cl(y/(vh*.9));hc.style.opacity=1-h*1.1;hc.style.transform=`translateY(${-h*40}px) scale(${1-h*.06})`;
const r=pin.getBoundingClientRect(),p=cl(-r.top/(r.height-vh));
ph.style.scale=rm?1:1.25-.25*cl(p*2.5);ph.style.opacity=rm?1:.25+.75*cl(p*5);
const q=rm?ws.length:cl((p-.05)/.6)*ws.length;ws.forEach((w,i)=>w.style.opacity=.16+.84*cl(q-i));
const ebt=rm?1:cl(p*5);sl1.style.transform=sl2.style.transform=`scaleX(${ebt})`;chips.forEach((c,i)=>{const t=rm?1:cl((p-.6-i*.06)/.13);c.style.opacity=t;c.style.transform=`translateY(${(1-t)*22}px)`});
document.querySelectorAll('.rv').forEach(el=>{const t=rm?1:cl((vh-el.getBoundingClientRect().top)/(vh*.45));el.style.opacity=t;el.style.scale=.94+.06*t;el.style.translate=`0 ${(1-t)*36}px`});
requestAnimationFrame(tick)}
const rnd=(a,b)=>a+Math.random()*(b-a);
const wb=document.getElementById('wb'),wc=wb.getContext('2d'),WC=['#38bdf8','#818cf8','#c084fc','#e879f9','#22d3ee'];
function wbd(t){const w=wb.offsetWidth,h=wb.offsetHeight;if(wb.width!==w||wb.height!==h){wb.width=w;wb.height=h}
if(scrollY<h*1.1){wc.clearRect(0,0,w,h);wc.lineWidth=50;wc.lineCap='round';const k=t*.0008+scrollY*.0015;
WC.forEach((c,i)=>{wc.strokeStyle=c;wc.beginPath();for(let x=0;x<=w+10;x+=10){const y=h*.5+(i-2)*34+Math.sin(x*.0035+k*(1+i*.12)+i*1.3)*h*.16+Math.sin(x*.0011-k*.7+i)*h*.12+Math.sin(x*.008+k*1.6+i*2)*h*.03;x?wc.lineTo(x,y):wc.moveTo(x,y)}wc.stroke()})}
if(!rm)requestAnimationFrame(wbd)}
requestAnimationFrame(wbd);
const sp=document.getElementById('sp'),sq=sp.getContext('2d');let ps=[];
function sdraw(t){const w=sp.offsetWidth,h=sp.offsetHeight;if(sp.width!==w){sp.width=w;sp.height=h;ps=Array.from({length:90},()=>({x:rnd(0,w),y:rnd(0,h),r:rnd(.5,1.6),p:rnd(0,6),s:rnd(.8,2.5)}))}
sq.clearRect(0,0,w,h);sq.fillStyle='#fff';ps.forEach(q=>{sq.globalAlpha=.15+.85*Math.abs(Math.sin(t*.001*q.s+q.p));sq.beginPath();sq.arc(q.x,q.y,q.r,0,7);sq.fill()});if(!rm)requestAnimationFrame(sdraw)}
requestAnimationFrame(sdraw);
tick();
</script>
